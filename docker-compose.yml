version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: typemind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]
      - ML_MODEL_PATH=app/ml/artifacts/type_classifier.joblib
      - MIN_CONFIDENCE_THRESHOLD=0.60
      - MAX_SOURCE_SIZE_BYTES=500000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - typemind-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: typemind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - typemind-net

networks:
  typemind-net:
    driver: bridge
